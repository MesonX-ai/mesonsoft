<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meson X — Cloud AI</title>
<meta name="color-scheme" content="dark">
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0; overflow: hidden; background:
    radial-gradient(1200px 800px at 70% -10%, #141a3d 0%, #0a0e24 55%, #06081a 100%); }
  canvas#glass { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair }

  /* Same brand fonts as the site header — relative so the page works on file:// too */
  @font-face { font-family: 'Zillah Modern Line'; src: url('assets/fonts/ZillahModernLine.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap }
  @font-face { font-family: 'ZnikomitNo25'; src: url('assets/fonts/ZnikomitNo25.otf') format('opentype'); font-weight: normal; font-style: normal; font-display: swap }

  /* MESON X on the glass, centered, ≈60% of the glass panel width.
     Glass panel spans 14%–86% of the viewport (72vw); 60% of that = 43.2vw.
     Glyph ratio measured from the site header: "MESON X" ≈ 128.2px at 42px,
     so text = 42*4.852px = 14.15vw and X = 45*4.852px = 15.16vw. */
  .mesonx-wrap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;
    display: inline-flex; flex-direction: row; align-items: baseline; justify-content: center;
    line-height: 1; text-decoration: none; user-select: none; white-space: nowrap;
    filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.45)) }
  .mesonx-text { font-family: 'Zillah Modern Line', 'Zillah Modern', serif; font-size: 14.15vw;
    font-weight: normal; letter-spacing: .04em; color: #ffffff; line-height: 1; text-transform: uppercase;
    text-shadow: 0 0 12px rgba(0, 198, 255, 0.55), 0 0 28px rgba(123, 47, 255, 0.35), 0 0 46px rgba(255, 47, 180, 0.22) }
  .mesonx-x { position: relative; display: inline-block; font-family: 'ZnikomitNo25', 'Zillah Modern', serif;
    font-size: 15.16vw; font-weight: normal; line-height: 1; margin-left: .09em;
    animation: mesonx-pulse 4s ease-in-out infinite }
  .mesonx-x-base { color: #ffffff }
  .mesonx-x-grad { position: absolute; inset: 0;
    background-image: linear-gradient(90deg, #ff2fb4, #7b2fff, #00c6ff, #22d3a7, #ff2fb4);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    opacity: 0; animation: mesonx-shine 4s ease-in-out infinite }
  @keyframes mesonx-pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.18) } }
  @keyframes mesonx-shine { 0%,100% { opacity: 0 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .mesonx-x, .mesonx-x-grad { animation: none } .mesonx-x-grad { opacity: 1 } }

  #err { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9; display: none;
    max-width: 580px; padding: 18px 22px; border-radius: 14px; background: #2a1030; color: #ffd7e8;
    font: 500 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; white-space: pre-wrap;
    border: 1px solid #ff5ba1; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5) }
</style>
</head>
<body>
  <canvas id="glass" aria-label="Meson X liquid glass panel"></canvas>

  <a class="mesonx-wrap" href="https://www.squark-browser.ai/cloud-ai/" target="_blank" rel="noopener"
     title="Meson — Cloud AI" aria-label="Meson — Cloud AI">
    <span class="mesonx-text">MESON</span><span class="mesonx-x"><span class="mesonx-x-base">X</span><span class="mesonx-x-grad" aria-hidden="true">X</span></span>
  </a>

  <div id="err"></div>

  <!-- Liquid glass engine (pure WebGL, no CDN): -->
  <script src="liquid-glass.js"></script>
  <script>
    'use strict';
    (function () {
      try {
        MesonLiquidGlass.init(document.getElementById('glass'), {
          rect:     [0.14, 0.26, 0.86, 0.74],
          radiusPx: 96,
          solidBg:  true
        });
      } catch (e) {
        var el = document.getElementById('err');
        el.style.display = 'block';
        el.textContent = 'WebGL init failed:\n' + e.message;
      }
    })();
  </script>
</body>
</html>
